experiment:
  name: phase14_baseline_vs_forge
  version: "1.0"

generation:
  provider: gemini
  model: gemini-3.5-flash-lite
  temperature: 0.7
  max_output_tokens: 1024

analysis:
  mode: core
  core30_source: data/storyscope/core30_approximation.json

systems:
  - baseline
  - prompt_revision
  - narrative_forge

forge:
  max_cycles: 3

dataset:
  path: evaluation/datasets/prompts.jsonl

output:
  directory: evaluation/runs/
