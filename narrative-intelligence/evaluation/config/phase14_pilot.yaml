experiment:
  name: phase14_pilot
  version: "1.0"

generation:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.7
  max_output_tokens: 1024

analysis:
  provider: gemini
  model: gemini-3.5-flash-lite
  mode: core
  core30_source: data/storyscope/core30_approximation.json

systems:
  - baseline
  - prompt_revision
  - narrative_forge

forge:
  max_cycles: 1

dataset:
  path: evaluation/datasets/prompts.jsonl
  prompt_ids:
    - MYS_001
    - SCI_001
    - LIT_001
    - THR_001

output:
  directory: evaluation/runs/
